services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scholar
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d scholar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY}
      PGHOST: db
      PGPORT: 5432
      PGUSER: scholar
      PGPASSWORD: scholar
      PGDATABASE: scholar
    command: python3 main.py --topic "machine learning" --days 7 --limit 50

volumes:
  pgdata:
