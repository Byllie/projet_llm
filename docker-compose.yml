services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scholar
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d scholar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY}
      PGHOST: db
      PGPORT: 5432
      PGUSER: scholar
      PGPASSWORD: scholar
      PGDATABASE: scholar
    command: python3 main.py --topic "machine learning" --days 7 --limit 50

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      PGHOST: db
      PGPORT: 5432
      PGUSER: scholar
      PGPASSWORD: scholar
      PGDATABASE: scholar
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

volumes:
  pgdata:
